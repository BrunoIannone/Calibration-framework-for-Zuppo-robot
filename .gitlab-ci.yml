# Use a lightweight Alpine Linux image
image: alpine:latest

pages:
  stage: deploy
  script:
    - apk add --no-cache doxygen graphviz ttf-freefont
    - mkdir -p public/zuppo_calibrator public/map_builder public/lidar_publisher

    - cd src/zuppo_calibrator
    - doxygen Doxyfile
    - mv html/* ../../public/zuppo_calibrator/
    - cd ../..

    - cd src/map_builder
    - doxygen Doxyfile
    - mv html/* ../../public/map_builder/
    - cd ../..

    - cd src/lidar_publisher
    - doxygen Doxyfile
    - mv html/* ../../public/lidar_publisher/
    - cd ../..

    - cp docs/index.html public/index.html

  artifacts:
    paths:
      - public/

  rules:
    # Build and deploy only on commits to primary branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
