
name: Build and Deploy Doxygen Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz fonts-freefont-ttf

      - name: Create documentation directories
        run: |
          mkdir -p public/zuppo_calibrator
          mkdir -p public/map_builder
          mkdir -p public/lidar_publisher

      - name: Generate zuppo_calibrator documentation
        run: |
          cd src/zuppo_calibrator
          doxygen Doxyfile
          mv html/* ../../public/zuppo_calibrator/

      - name: Generate map_builder documentation
        run: |
          cd src/map_builder
          doxygen Doxyfile
          mv html/* ../../public/map_builder/

      - name: Generate lidar_publisher documentation
        run: |
          cd src/lidar_publisher
          doxygen Doxyfile
          mv html/* ../../public/lidar_publisher/

      - name: Copy documentation index
        run: cp docs/index.html public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
